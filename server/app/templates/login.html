<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>登录 · CarVista</title>
  <link rel="icon" href="/static/app-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/css/tabler.min.css">
  <style>
    body.login-page {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #f8fbff 0%, #eef7f6 48%, #f6f3fb 100%);
      color: #1c2430;
    }
    .login-shell { width: min(420px, calc(100% - 32px)); }
    .login-mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
    }
    .login-mark img { width: 72px; height: 72px; border-radius: 18px; display: block; }
    .login-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(28, 55, 70, 0.08);
      padding: 32px 28px 28px;
    }
    .login-card h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
    .login-card .lead { margin: 8px 0 0; color: #667387; font-size: 14px; }
    .login-card .form-control {
      min-height: 46px;
      border-radius: 12px;
      border-color: #d7e0e8;
      background: #fff;
    }
    .login-card .form-control:focus {
      border-color: #0b7a86;
      box-shadow: 0 0 0 3px rgba(11, 122, 134, 0.15);
    }
    .login-card .btn-primary {
      min-height: 46px;
      border: 0;
      border-radius: 12px;
      background: #0b7a86;
    }
    .login-card .btn-primary:hover { background: #096874; }
  </style>
</head>
<body class="login-page">
  <main class="login-shell">
    <form class="login-card" method="post" action="/admin/login" autocomplete="off">
      <div class="text-center mb-4">
        <div class="login-mark" aria-hidden="true"><img src="/static/app-icon.png" width="72" height="72" alt=""></div>
        <h1>登录 CarVista</h1>
        <p class="lead">管理图库里的别克大联屏和共享壁纸</p>
      </div>
      {% if msg %}<div class="alert alert-danger">{{ msg }}</div>{% endif %}
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="mb-3">
        <label class="form-label" for="username">账号</label>
        <input class="form-control" id="username" name="username" autocomplete="username" placeholder="管理员账号" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">密码</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" placeholder="密码" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">进入后台</button>
    </form>
  </main>
</body>
</html>
