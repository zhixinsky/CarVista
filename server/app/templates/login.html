<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>登录 · CarVista</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 sans-serif; background: #f4f6f8; }
    form { width: 320px; background: #fff; border: 1px solid #dde3ea; border-radius: 12px; padding: 20px; display: grid; gap: 10px; }
    input { padding: 8px; border: 1px solid #c5ced8; border-radius: 8px; }
    button { padding: 8px; border: 0; border-radius: 8px; background: #0b7a86; color: #fff; }
    p { margin: 0; color: #9a3b3b; }
  </style>
</head>
<body>
  <form method="post" action="/admin/login">
    <strong>CarVista 后台</strong>
    {% if msg %}<p>{{ msg }}</p>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input name="username" autocomplete="username" placeholder="账号" required>
    <input name="password" type="password" autocomplete="current-password" placeholder="密码" required>
    <button>登录</button>
  </form>
</body>
</html>
