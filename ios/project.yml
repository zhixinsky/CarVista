name: CarCanvasDiagnostics
options:
  bundleIdPrefix: local.carcanvas
  deploymentTarget:
    iOS: '17.0'
targets:
  CarCanvasDiagnostics:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.carcanvas.diagnostics
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
