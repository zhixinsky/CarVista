name: CarCanvasWorkshop
options:
  bundleIdPrefix: local.carcanvas
  deploymentTarget:
    iOS: '17.0'
targets:
  CarCanvasWorkshop:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Vendor/WQFiles
        excludes: [LICENSE, tests]
      - path: LICENSE
        buildPhase: resources
      - path: Vendor/NOTICE.md
        buildPhase: resources
    dependencies:
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.carcanvas.workshop
        INFOPLIST_KEY_CFBundleDisplayName: CarCanvas
        MARKETING_VERSION: '0.3.2'
        CURRENT_PROJECT_VERSION: '6'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: CarCanvas.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge.h
        HEADER_SEARCH_PATHS: '$(SRCROOT)/Vendor/WQFiles'
        CLANG_ENABLE_OBJC_ARC: YES
  CarCanvasModelTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ModelTests]
    dependencies:
      - target: CarCanvasWorkshop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.carcanvas.workshop.modeltests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
  CarCanvasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CarCanvasWorkshop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.carcanvas.workshop.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
schemes:
  CarCanvasWorkshop:
    build:
      targets:
        CarCanvasWorkshop: all
        CarCanvasUITests: [test]
        CarCanvasModelTests: [test]
    test:
      targets: [CarCanvasModelTests, CarCanvasUITests]
